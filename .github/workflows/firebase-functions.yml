name: Deploy Firebase functions

# Functions-only (sosFanout, alarmFanout, privacyRetention). Never deploys
# database rules, hosting or anything else. Manual run only.
# Uses whichever credential already exists in the repo's secrets:
#   FIREBASE_TOKEN           — from `firebase login:ci`
#   FIREBASE_SERVICE_ACCOUNT — service-account JSON
# If neither is set, the job says so plainly and stops.

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Which credential is available?
        id: cred
        env:
          TOK: ${{ secrets.FIREBASE_TOKEN }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$TOK" ]; then echo "mode=token" >> $GITHUB_OUTPUT; echo "Found FIREBASE_TOKEN";
          elif [ -n "$SA" ]; then echo "mode=sa" >> $GITHUB_OUTPUT; echo "Found FIREBASE_SERVICE_ACCOUNT";
          else echo "mode=none" >> $GITHUB_OUTPUT; echo "NO CREDENTIAL IN REPO SECRETS"; fi

      - name: Install function dependencies
        if: steps.cred.outputs.mode != 'none'
        run: npm install --prefix functions --no-audit --no-fund

      - name: Syntax check
        if: steps.cred.outputs.mode != 'none'
        run: node --check functions/index.js && node --check functions/retention.js

      - name: Deploy with CI token
        if: steps.cred.outputs.mode == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@13 deploy --only functions --project shomergency --non-interactive

      - name: Deploy with service account
        if: steps.cred.outputs.mode == 'sa'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 deploy --only functions --project shomergency --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: No credential
        if: steps.cred.outputs.mode == 'none'
        run: |
          echo "::error::No FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT secret in this repo."
          echo "Add one at Settings -> Secrets and variables -> Actions, then re-run."
          exit 1
