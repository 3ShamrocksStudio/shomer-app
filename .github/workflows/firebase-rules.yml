name: Deploy Firebase database rules

# Rules-only. Never deploys functions, hosting or anything else.
# Uses whichever credential already exists in the repo's secrets:
#   FIREBASE_TOKEN          — from `firebase login:ci`
#   FIREBASE_SERVICE_ACCOUNT — service-account JSON
# If neither is set, the job says so plainly and stops.

on:
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Which credential is available?
        id: cred
        env:
          TOK: ${{ secrets.FIREBASE_TOKEN }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$TOK" ]; then echo "mode=token" >> $GITHUB_OUTPUT; echo "Found FIREBASE_TOKEN";
          elif [ -n "$SA" ]; then echo "mode=sa" >> $GITHUB_OUTPUT; echo "Found FIREBASE_SERVICE_ACCOUNT";
          else echo "mode=none" >> $GITHUB_OUTPUT; echo "NO CREDENTIAL IN REPO SECRETS"; fi

      # database.rules.json carries // comments, which Firebase accepts and JSON.parse does not.
      # This step failed on every run since the comments were added, and the log line above it
      # ("NO CREDENTIAL IN REPO SECRETS") was then read as the cause - sending a whole audit after
      # a credential that was never the problem. Strip comments the way Firebase does, then parse.
      - name: Validate rules file
        run: |
          node -e "
          const fs=require('fs');
          let s=fs.readFileSync('database.rules.json','utf8');
          s=s.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|[^:])\/\/[^\n]*/g,'\$1');
          const r=JSON.parse(s);
          const n=Object.keys(r.rules||{}).length;
          if(!n) throw new Error('no rules found');
          console.log('database.rules.json parses OK · '+n+' top-level paths');
          "

      - name: Deploy with CI token
        if: steps.cred.outputs.mode == 'token'
        run: npx -y firebase-tools@13 deploy --only database --project shomergency --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy with service account
        if: steps.cred.outputs.mode == 'sa'
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx -y firebase-tools@13 deploy --only database --project shomergency --non-interactive
          rm -f /tmp/sa.json

      # Not an error. Rules are deployed straight to the RTDB admin API during a working session,
      # and the live rules are verified against this file afterwards. This job is the validator
      # and an optional deploy path - it must not go red for a credential nobody intends to add,
      # because a permanently failing job is read as a broken product.
      - name: No credential - validation only
        if: steps.cred.outputs.mode == 'none'
        run: |
          echo "::notice::Rules file validated. No deploy credential in this repo, so nothing was deployed here."
          echo "Rules are deployed directly to the RTDB admin API and verified by reading them back."
