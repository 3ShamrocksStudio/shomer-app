<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SH✡MER Command · Municipal Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{--gold:#faac22;--blue:#1e315f;--dark:#0c1b39;--ink:#081222;--card:#0f1f3b;--card2:#15284b;--b:#223a63;--tx:#e8eefc;--tx2:#9fb2d4;--tx3:#6b82ab;
    --c-prop:#2f80ed;--c-order:#f2b705;--c-body:#e5484d;--c-moral:#e5468e;--c-fraud:#18c29c;--c-econ:#9b6cff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--tx);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;min-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:linear-gradient(180deg,#0e1d38,#0a1628);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.4px}
  .brand .s{color:var(--gold)}
  .brand small{display:block;font-weight:500;font-size:10px;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase}
  .terr{display:flex;align-items:center;gap:8px}
  .terr label{font-size:11px;color:var(--tx3)}
  select{height:40px;background:var(--card2);border:1px solid var(--b);border-radius:10px;color:var(--tx);padding:0 12px;font-size:14px;outline:none;min-width:180px}
  select:focus{border-color:var(--gold)}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)}
  .live .d{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px #2ecc71;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .wrap{max-width:1280px;margin:0 auto;padding:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:15px 16px}
  .stat .l{font-size:11px;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
  .stat .v{font-size:26px;font-weight:800;line-height:1}
  .stat .m{font-size:11.5px;color:var(--tx2);margin-top:6px}
  .stat .v.gold{color:var(--gold)}
  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--b);border-radius:16px;overflow:hidden}
  .panel h2{font-size:12.5px;font-weight:800;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--b)}
  #map{height:460px;width:100%}
  .tiles-base{filter:none}
  .pbody{padding:14px 16px}
  .bar{margin-bottom:11px}
  .bar .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .bar .t .n{color:var(--tx2)}
  .bar .track{height:9px;background:var(--card2);border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:start;padding:9px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
  th{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
  tr.me{background:rgba(250,172,34,.1)}
  tr.me td{font-weight:800;color:var(--gold)}
  .rank-wrap{max-height:360px;overflow-y:auto}
  .feed .item{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.05);align-items:center}
  .feed .dot{width:34px;height:34px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .feed .nm{font-size:13.5px;font-weight:600}
  .feed .mt{font-size:11px;color:var(--tx3)}
  .empty{color:var(--tx3);font-size:12.5px;padding:18px 16px;text-align:center;line-height:1.6}
  .note{color:var(--tx3);font-size:11px;text-align:center;padding:18px 10px;line-height:1.7}
  .legend{display:flex;flex-wrap:wrap;gap:10px;padding:0 16px 14px;font-size:11px;color:var(--tx2)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .sectitle{font-size:12px;color:var(--tx3);margin:18px 2px 10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">SH<span class="s">✡</span>MER <span style="color:var(--tx3);font-weight:400">Command</span>
    <small>Municipal Intelligence · מודיעין עירוני</small></div>
  <div class="terr">
    <label>טריטוריה:</label>
    <select id="city"></select>
  </div>
  <div class="live"><span class="d"></span><span id="live-lbl">LIVE · משטרת ישראל 2025</span></div>
</div>

<div class="wrap">
  <div class="cards" id="cards"></div>

  <div class="grid">
    <div class="panel">
      <h2>מפת פשיעה · נקודות חום בטריטוריה</h2>
      <div id="map"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <h2>פילוח סוגי עבירות</h2>
      <div class="pbody" id="bars"></div>
    </div>
  </div>

  <div class="sectitle">אירועים חיים בטריטוריה · SOS · נעדרים · דיווחים</div>
  <div class="panel feed"><div id="feed"><div class="empty" id="feed-empty">מתחבר לרשת SH✡MER…</div></div></div>

  <div class="sectitle">דירוג ארצי · איפה הטריטוריה שלך עומדת</div>
  <div class="panel"><div class="rank-wrap"><table id="ranktbl"><thead><tr><th>#</th><th>עיר</th><th>סה״כ עבירות 2025</th><th>סוג מוביל</th></tr></thead><tbody id="rankbody"></tbody></table></div></div>

  <div class="note" id="note"></div>
</div>

<script>
var CAT_COL={'עבירות כלפי הרכוש':'#2f80ed','עבירות סדר ציבורי':'#f2b705','עבירות נגד גוף':'#e5484d','עבירות כלפי המוסר':'#e5468e','עבירות מרמה':'#18c29c','עבירות כלכליות':'#9b6cff'};
var DATA=null, MAP=null, cityLayer=null;
var ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';
var ESRIr='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}';

function fmt(n){return (n||0).toLocaleString('en-US');}
function topCat(cats){var b='',v=-1;for(var k in cats){if(cats[k]>v){v=cats[k];b=k;}}return {name:b,val:v};}

fetch('crime-stats.json?v=2').then(function(r){return r.json();}).then(function(d){
  DATA=d;
  var cities=d.cities.slice().sort(function(a,b){return b.total-a.total;});
  DATA._sorted=cities;
  var sel=document.getElementById('city');
  cities.forEach(function(c,i){var o=document.createElement('option');o.value=i;o.textContent=c.city;sel.appendChild(o);});
  sel.onchange=function(){render(+sel.value);};
  initMap();
  render(0); // default: biggest territory
  document.getElementById('note').innerHTML='מקור: '+ (d.source||'משטרת ישראל') +' · '+(d.period||'2025')+' · '+fmt(d.records)+' רשומות · data.gov.il<br>הנתונים מוצגים לטריטוריה הנבחרת בלבד · גישה: 3Shamrocks Studio ולקוחות משלמים בלבד · מוצפן · לעולם לא נמכר.';
  renderLegend();
}).catch(function(e){ document.getElementById('note').textContent='שגיאה בטעינת נתונים'; });

function initMap(){
  MAP=L.map('map',{zoomControl:true,attributionControl:false}).setView([31.5,34.9],7);
  L.tileLayer(ESRI,{maxZoom:16,className:'tiles-base'}).addTo(MAP);
  L.tileLayer(ESRIr,{maxZoom:16}).addTo(MAP);
}
function renderLegend(){
  var el=document.getElementById('legend'); el.innerHTML='';
  Object.keys(CAT_COL).forEach(function(k){ el.innerHTML+='<span><i style="background:'+CAT_COL[k]+'"></i>'+k+'</span>'; });
}
function render(idx){
  var cities=DATA._sorted, c=cities[idx]; if(!c)return;
  var rank=idx+1, tot=c.total, tc=topCat(c.cats);
  var natTotal=cities.reduce(function(s,x){return s+x.total;},0);
  var pct=((tot/natTotal)*100).toFixed(1);
  // cards
  document.getElementById('cards').innerHTML=
    card('סה״כ עבירות 2025', fmt(tot), c.city, 'gold')+
    card('דירוג ארצי', '#'+rank+' / '+cities.length, 'מתוך הערים המדווחות')+
    card('סוג עבירה מוביל', tc.name, fmt(tc.val)+' ('+Math.round(tc.val/tot*100)+'%)')+
    card('נתח מכלל הארץ', pct+'%', fmt(natTotal)+' ארצי');
  // map
  if(cityLayer){MAP.removeLayer(cityLayer);} cityLayer=L.layerGroup().addTo(MAP);
  var cats=Object.keys(c.cats);
  var maxCat=Math.max.apply(null,cats.map(function(k){return c.cats[k];}));
  // central hotspot
  L.circle([c.lat,c.lng],{radius:Math.sqrt(tot)*35,color:CAT_COL[tc.name],fillColor:CAT_COL[tc.name],fillOpacity:.18,weight:1.5}).addTo(cityLayer);
  // category distribution around center (visual density of the real category totals)
  cats.forEach(function(k,i){
    var ang=(i/cats.length)*Math.PI*2, dist=0.018+(c.cats[k]/maxCat)*0.03;
    var la=c.lat+Math.cos(ang)*dist, ln=c.lng+Math.sin(ang)*dist/Math.cos(c.lat*Math.PI/180);
    L.circleMarker([la,ln],{radius:6+Math.sqrt(c.cats[k])/6,color:'#0a1628',weight:1.5,fillColor:CAT_COL[k]||'#888',fillOpacity:.8})
      .bindPopup('<b>'+k+'</b><br>'+fmt(c.cats[k])+' עבירות ('+c.city+')').addTo(cityLayer);
  });
  MAP.setView([c.lat,c.lng],12,{animate:true});
  // bars
  var bars=document.getElementById('bars'); bars.innerHTML='';
  cats.sort(function(a,b){return c.cats[b]-c.cats[a];}).forEach(function(k){
    var p=Math.round(c.cats[k]/tot*100);
    bars.innerHTML+='<div class="bar"><div class="t"><span class="n">'+k+'</span><span>'+fmt(c.cats[k])+' · '+p+'%</span></div><div class="track"><div class="fill" style="width:'+p+'%;background:'+(CAT_COL[k]||'#888')+'"></div></div></div>';
  });
  // ranking table
  var rb=document.getElementById('rankbody'); rb.innerHTML='';
  cities.forEach(function(x,i){ var xt=topCat(x.cats);
    rb.innerHTML+='<tr class="'+(i===idx?'me':'')+'"><td>'+(i+1)+'</td><td>'+x.city+'</td><td>'+fmt(x.total)+'</td><td>'+xt.name+'</td></tr>';
  });
  // live incidents in territory
  loadLive(c);
}
function card(l,v,m,cls){return '<div class="stat"><div class="l">'+l+'</div><div class="v '+(cls||'')+'">'+v+'</div><div class="m">'+(m||'')+'</div></div>';}

/* live incidents: best-effort read of the SH✡MER network, filtered to the territory */
function haversine(la1,lo1,la2,lo2){var R=6371,r=Math.PI/180,dLa=(la2-la1)*r,dLo=(lo2-lo1)*r;var a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));}
function loadLive(c){
  var feed=document.getElementById('feed'); var within=[];
  var DB='https://shomergency-default-rtdb.firebaseio.com';
  Promise.all([
    fetch(DB+'/sos.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch(DB+'/palerts.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch(DB+'/events.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(res){
    [['sos',res[0]],['palert',res[1]],['event',res[2]]].forEach(function(pair){
      var kind=pair[0],obj=pair[1]; if(!obj)return;
      Object.keys(obj).forEach(function(id){ var e=obj[id]; if(!e||e.lat==null)return;
        if(e.resolved||e.status==='resolved')return;
        if(haversine(c.lat,c.lng,e.lat,e.lng)<=18){ within.push({kind:kind,e:e}); }
      });
    });
    if(!within.length){ feed.innerHTML='<div class="empty">אין אירועים חיים בטריטוריה כעת.<br>הזרם מתעדכן אוטומטית ממשתמשי SH✡MER באזור הלקוח.</div>'; return; }
    within.sort(function(a,b){return (b.e.ts||0)-(a.e.ts||0);});
    feed.innerHTML=within.slice(0,30).map(function(w){
      var ic=w.kind==='palert'?(w.e.kind==='abduct'?'🚨':'🔎'):(w.kind==='sos'?'🆘':'📍');
      var nm=w.kind==='palert'?(w.e.subjName||'התראת אדם'):(w.kind==='sos'?'קריאת SOS':(w.e.type||'דיווח'));
      var ph=w.e.subjPhoto?'<img src="'+w.e.subjPhoto+'" style="width:34px;height:34px;border-radius:9px;object-fit:cover">':'<div class="dot">'+ic+'</div>';
      var when=w.e.ts?new Date(w.e.ts).toLocaleString('he-IL'):'';
      return '<div class="item">'+ph+'<div style="flex:1"><div class="nm">'+ic+' '+String(nm).replace(/[<>]/g,'')+'</div><div class="mt">'+when+' · '+(+w.e.lat).toFixed(3)+','+(+w.e.lng).toFixed(3)+'</div></div></div>';
    }).join('');
  });
}
</script>
</body>
</html>
