<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SH✡MER Command · Municipal Intelligence</title>
<link rel="icon" href="logo-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* SH✡MER Command — brand tokens: #faac22 gold · #1e315f blue · #0c1b39 navy */
  @font-face{font-family:'Marion';src:local('Marion Bold'),local('Marion-Bold'),local('Marion');font-weight:700;font-display:swap}
  :root{
    --gold:#faac22;--gold-d:#c98a12;--gold-s:rgba(250,172,34,.14);--gold-l:rgba(250,172,34,.38);
    --navy:#0c1b39;--navy-0:#08142c;--navy-1:#0f2145;--navy-2:#13284f;--blue:#1e315f;--blue-2:#28407a;
    --line:rgba(160,184,230,.13);--line-2:rgba(160,184,230,.22);
    --bg0:var(--navy);--bg1:var(--navy-0);
    --dark:var(--navy-1);--dark2:var(--navy-2);--db:var(--blue);
    --ivory:#f4f1ea;--ivory2:#eae5da;--ink:#191c22;
    --tx:#eef2fb;--tx2:#a3b1cc;--tx3:#6f80a3;
    --ok:#2bc47e;--warn:#faac22;--bad:#ef4853;
    --blue-acc:#4f8df5;--violet:#9b6cff;--teal:#19c3a5;--pink:#e5468e;
    --font:'Alef',system-ui,-apple-system,Arial,sans-serif;
    --num:'Inter','Alef',system-ui,sans-serif;
    --gap:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--navy-0);color:var(--tx);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  .hidden{display:none!important}
  .wordmark{font-family:'Marion','Alef',serif;font-weight:700;letter-spacing:.01em}
  .num,.kpi .kv,.up-st-v,.rank .tot,.rank .pos{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  /* ---------- GATE ---------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% -10%,#1e315f,var(--navy-0) 62%)}
  .gate .box{width:100%;max-width:400px;background:var(--navy-1);border:1px solid var(--blue);border-radius:16px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .gate h1{text-align:center;font-size:25px;font-weight:700;margin-bottom:4px}
  .gate h1 .s{color:var(--gold)}
  .gate .tag{text-align:center;font-size:11px;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
  label{display:block;font-size:12px;color:var(--tx2);margin:12px 0 5px}
  input,select{width:100%;height:46px;background:var(--navy-0);border:1px solid var(--blue);border-radius:10px;color:var(--tx);padding:0 14px;font-size:15px;outline:none;font-family:inherit}
  input:focus,select:focus{border-color:var(--gold)}
  .btn{width:100%;height:48px;border:0;border-radius:10px;background:var(--gold);color:#1a1204;font-weight:700;font-size:16px;cursor:pointer;margin-top:18px;font-family:inherit}
  .btn:active{transform:scale(.99)}
  .lnk{display:block;text-align:center;margin-top:14px;color:var(--tx2);font-size:13px;cursor:pointer;background:none;border:0;width:100%;font-family:inherit}
  .lnk b{color:var(--gold)}
  .err{color:#ff6b7d;font-size:13px;margin-top:12px;min-height:16px;text-align:center}
  /* ---------- APP SHELL ---------- */
  #app{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(1400px 700px at 85% -10%,rgba(30,49,95,.55),transparent 60%),var(--navy-0)}
  .topbar{display:flex;align-items:center;gap:12px;padding:0 16px;height:54px;flex:0 0 54px;background:var(--navy);border-bottom:1px solid var(--line-2);box-shadow:0 1px 0 rgba(250,172,34,.18)}
  .brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .brand small{font-weight:700;font-size:10.5px;color:var(--tx2);letter-spacing:.16em;text-transform:uppercase;padding-inline-start:10px;border-inline-start:1px solid var(--line-2)}
  .tb-sp{flex:1}
  .terr-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
  .terr-pick select{height:34px;width:auto;min-width:150px;background:var(--navy-2);border-color:var(--blue-2);font-size:13.5px;font-weight:700;color:var(--tx);border-radius:8px;padding:0 10px}
  .live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);white-space:nowrap}
  .live .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .tbtn{background:transparent;border:1px solid var(--blue-2);color:var(--tx2);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:border-color .15s,color .15s}
  .tbtn:hover{border-color:var(--gold);color:var(--tx)}
  /* ---------- COMMAND GRID — physical layout (LTR grid, RTL content) ----------
     ┌ rank ┬──── stats ────┬──── profile ────┐  row 1 ≈ 15%
     ├──── emergency + feed ───┤               │
     ├── graph ──┬── donut ────┤      MAP      │  rows 2–3
     └───────────┴─────────────┴───────────────┘   left 57% · right 43% */
  .cmd-grid{direction:ltr;flex:1;min-height:0;display:grid;gap:var(--gap);padding:var(--gap) 16px 14px;
    grid-template-columns:minmax(0,15fr) minmax(0,13.5fr) minmax(0,28.5fr) minmax(0,43fr);
    grid-template-rows:minmax(0,15fr) minmax(0,46fr) minmax(0,39fr);
    grid-template-areas:"rank crime net prof" "recs recs feed map" "graph graph donut map"}
  /* one shared centre line: the crime|network KPI gap, the recs|feed gap and the graph|donut gap
     all sit on the same column-2/column-3 grid line, so they align by construction */
  .cmd-grid>*{min-height:0;min-width:0}
  .c-rank{grid-area:rank}.c-crime{grid-area:crime}.c-net{grid-area:net}.c-prof{grid-area:prof}.c-recs{grid-area:recs}.c-feed{grid-area:feed}.c-graph{grid-area:graph}.c-donut{grid-area:donut}.c-map{grid-area:map}
  .card{direction:rtl;background:linear-gradient(180deg,rgba(30,49,95,.42),rgba(15,33,69,.55));border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .ch{display:flex;align-items:center;gap:8px;padding:9px 13px 8px;flex:0 0 auto;border-bottom:1px solid var(--line)}
  .ch .t{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t b{color:var(--gold);font-weight:700}
  .ch .sp{flex:1}
  .ch-btn{background:none;border:1px solid var(--line-2);color:var(--tx2);border-radius:6px;padding:2px 8px;font:700 11px var(--font);cursor:pointer;white-space:nowrap}
  .ch-btn:hover{border-color:var(--gold);color:var(--gold)}
  .cb{flex:1;min-height:0;overflow:hidden;position:relative}
  .pane{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .pb{flex:1;min-height:0;overflow:hidden;padding:10px 13px}
  .pb.nopad{padding:0}
  .pill{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
  .pill.off{background:rgba(79,141,245,.14);color:#93b8ff;border:1px solid rgba(79,141,245,.32)}
  .pill.live{background:rgba(239,72,83,.14);color:#ff8f98;border:1px solid rgba(239,72,83,.36)}
  .pill.gold{background:var(--gold-s);color:var(--gold);border:1px solid var(--gold-l)}
  /* ---------- RANKING (compact) ---------- */
  .rank{display:flex;flex-direction:column;justify-content:space-evenly;padding:2px 0}
  .rank .row{display:flex;align-items:center;gap:8px;padding:0 12px;flex:1 1 0;min-height:0;font-size:12.5px;cursor:pointer;border-inline-start:2px solid transparent}
  .rank .row:hover{background:rgba(255,255,255,.035)}
  .rank .row.me{background:var(--gold-s);border-inline-start-color:var(--gold)}
  .rank .row.me .city{color:var(--gold);font-weight:700}
  .rank .pos{width:24px;color:var(--tx3);font-weight:700;text-align:center;font-size:11.5px}
  .rank .row.me .pos{color:var(--gold)}
  .rank .city{flex:1;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank .tot{color:var(--tx2);font-weight:600;font-size:11.5px}
  .rank-all{display:grid;grid-template-columns:repeat(4,1fr);gap:0 16px;direction:rtl}
  .rank-all .row{display:flex;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;cursor:pointer;border-radius:4px}
  .rank-all .row:hover{background:rgba(255,255,255,.05)}
  .rank-all .row.me{background:var(--gold-s);color:var(--gold);font-weight:700}
  .rank-all .pos{width:22px;color:var(--tx3);font-family:var(--num);font-variant-numeric:tabular-nums}
  .rank-all .city{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-all .tot{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--tx2);font-size:11px}
  .rank-note{font-size:11.5px;color:var(--tx2);line-height:1.55;margin-bottom:10px}
  /* ---------- KPI STRIP ---------- */
  .kpis{flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden}
  .kpi{flex:1 1 0;min-width:auto;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;border-inline-start:1px solid var(--line);position:relative;transition:background .15s}
  .kpi:first-child{border-inline-start:0}
  .kpi[onclick]{cursor:pointer}.kpi[onclick]:hover{background:rgba(255,255,255,.03)}
  .kpi .kl{font-size:11px;font-weight:700;color:var(--tx2);letter-spacing:.02em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .kl svg{width:13px;height:13px;flex:0 0 auto;opacity:.85}
  @media (max-width:1700px){.kpi .kl svg{display:none}}
  .kpi .kl span:not(.kprov){overflow:hidden;text-overflow:ellipsis}
  .kpi .kbadge{display:none}
  .kpi .kbody{display:contents}
  .kpi .kv{font-size:clamp(20px,1.6vw,32px);font-weight:700;line-height:1.25;color:var(--tx);white-space:nowrap;letter-spacing:-.01em}
  .kpi .kl,.kpi .km{contain:inline-size}
  .kpi .km{font-size:10.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .kprov{width:6px;height:6px;border-radius:50%;flex:0 0 auto;display:inline-block;font-size:0}
  .kprov.pub{background:#93b8ff}.kprov.net{background:#ff8f98}.kprov.nat{background:var(--teal)}
  .kpi .kv.gold{color:var(--gold)}.kpi .kv.bad{color:#ff6f78}.kpi .kv.ok{color:#5fdca2}
  .kpi .kv.gap{color:#6fc8ee}.kpi .kv.net-v{color:#ff9aa4}
  .kpi.b-gold::after,.kpi.b-bad::after{content:'';position:absolute;top:0;inset-inline:12px;height:2px;border-radius:0 0 2px 2px}
  .kpi.b-gold::after{background:var(--gold)}.kpi.b-bad::after{background:var(--bad)}
  .kchip{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-inline-start:6px}
  .stats-src{position:absolute;top:6px;inset-inline-end:8px;display:none}
  /* ---------- OPS (emergency · recommendations | events feed) ---------- */
  .ops-split{direction:ltr;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) 1px minmax(0,1fr)}
  .ops-split>*{direction:rtl;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .ops-div{background:var(--line-2)}
  .ops-recs .ch .t{color:#ff9aa4}
  .recs{padding:6px 13px 4px;display:flex;flex-direction:column;gap:0}
  .rh{font-size:10.5px;font-weight:700;color:var(--tx3);letter-spacing:.1em;margin:2px 0 2px;min-height:20px;display:flex;align-items:center;gap:6px}
  .rh b{color:var(--gold);font-weight:700;letter-spacing:0}
  .ri{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:7px;cursor:pointer;flex:0 0 auto}
  .recs>.rh,.recs>.juris{flex:0 0 auto}
  .ri:hover{background:rgba(255,255,255,.04)}
  .ri .ic{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:12px;font-weight:700;font-family:var(--num)}
  .ri .ic.up{background:rgba(239,72,83,.16);color:#ff8f98}
  .ri .ic.info{background:rgba(79,141,245,.16);color:#93b8ff}
  .ri .ic.flag{background:var(--gold-s);color:var(--gold)}
  .ri .ic.n{background:var(--gold);color:#1a1204}
  .ri .tx{flex:1;min-width:0}
  .ri .tt{font-size:13px;line-height:1.3;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ri .ph1{font-size:11.5px;line-height:1.35;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ri .ph1 b{color:var(--tx)}
  .ri .chev{color:var(--tx3);font-size:13px;flex:0 0 auto}
  .juris{font-size:11px;line-height:1.4;color:#f7c76a;background:var(--gold-s);border-radius:6px;padding:3px 9px;margin:2px 0 4px;display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec-detail .dd{font-size:13.5px;color:var(--tx2);line-height:1.65;margin:8px 0 12px}
  .rec-detail .dd b{color:var(--tx)}
  .rec-detail .src a{color:#93b8ff;font-size:12px;text-decoration:none}
  .rec-detail .src a:hover{text-decoration:underline}
  /* feed */
  .feed .item{display:flex;gap:10px;padding:0 13px;height:44px;flex:0 0 44px;border-bottom:1px solid rgba(255,255,255,.05);align-items:center;cursor:pointer}
  .feed .item:hover{background:rgba(255,255,255,.035)}
  .feed .sev{width:3px;height:26px;border-radius:3px;flex:0 0 auto}
  .feed .dot{width:28px;height:28px;border-radius:7px;background:var(--navy-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .feed .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed .mt{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed .item>div[style*="flex:1"]{min-width:0}
  .feed{display:flex;flex-direction:column}
  .feed-more{margin-top:auto;flex:0 0 auto;padding:6px 13px;font-size:11.5px;color:var(--gold);cursor:pointer;font-weight:700;border-top:1px solid var(--line)}
  .feed-more:hover{background:rgba(255,255,255,.03)}
  .empty{color:var(--tx3);font-size:12.5px;padding:18px 16px;text-align:center;line-height:1.6}
  /* ---------- CHART CARDS ---------- */
  .chart-host{flex:1;min-height:0;position:relative}
  .chart-host svg{position:absolute;inset:0;display:block}
  #analysispane{display:flex;flex-direction:column;padding:8px 12px 8px}
  #donutpane{padding:8px 12px}
  .dn{direction:ltr;display:flex;align-items:center;gap:14px;height:100%;min-height:0}
  .dn-ring{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .dn-side{direction:rtl;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .dleg .r{display:flex;align-items:center;gap:8px;padding:0 6px;border-radius:6px;cursor:pointer;min-height:0}
  .dleg .r:hover{background:rgba(255,255,255,.05)}
  .dleg .r .ico{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
  .dleg .r .ico svg{width:12px;height:12px}
  .dleg .r .n{flex:1;font-size:12.5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dleg .r .v{font-weight:700;font-size:12.5px;font-family:var(--num);font-variant-numeric:tabular-nums}
  .dleg .r .chev{display:none}
  .dd-back{background:var(--navy-2);border:1px solid var(--line-2);color:var(--tx2);border-radius:6px;padding:2px 9px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700}
  .dd-back:hover{color:var(--gold);border-color:var(--gold)}
  .ddr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;padding:0 2px;border-bottom:1px solid rgba(255,255,255,.06);min-height:0;flex:1 1 0;max-height:26px}
  .ddr span{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ddr b{direction:ltr;unicode-bidi:isolate;font-weight:700;white-space:nowrap;font-family:var(--num);font-variant-numeric:tabular-nums}
  .ddh{font-size:10px;color:var(--tx3);letter-spacing:.08em;margin:6px 0 3px;font-weight:700;flex:0 0 auto}
  .cmp{display:flex;align-items:center;gap:7px;font-size:11px;flex:1 1 0;min-height:0;max-height:18px}
  .cmp .nm{width:64px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmp .tr{flex:1;height:6px;background:var(--navy-2);border-radius:4px;overflow:hidden}
  .cmp .fl{display:block;height:100%;border-radius:4px}
  .cmp.me .nm{color:var(--tx);font-weight:700}
  .cmp .vv{width:44px;text-align:end;font-weight:700;color:var(--tx);font-family:var(--num);font-variant-numeric:tabular-nums}
  .foot{font-size:10px;color:var(--tx3);line-height:1.4;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ---------- MAP (hero) ---------- */
  .c-map{border-color:var(--line-2);box-shadow:0 0 0 1px rgba(250,172,34,.10),0 18px 50px rgba(0,0,0,.35)}
  .c-map .ch .t{color:var(--tx)}
  #map{flex:1;min-height:0;width:100%;background:#0a1430}
  .map-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
  .leaflet-container{font-family:var(--font)}
  .c-map .base-tiles{filter:sepia(.55) hue-rotate(185deg) saturate(2.1) brightness(.92) contrast(1.25)}
  .c-map .label-tiles{filter:brightness(1.35) contrast(1.1)}
  .leaflet-control-attribution{background:rgba(8,20,44,.7)!important;color:var(--tx3)!important;font-size:9.5px!important}
  .leaflet-bar a{background:var(--navy-1)!important;color:var(--tx)!important;border-color:var(--blue)!important}
  .leaflet-bar a:hover{background:var(--navy-2)!important;color:var(--gold)!important}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--navy-1);color:var(--tx);border:1px solid var(--blue);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .leaflet-popup-content{font-family:var(--font);font-size:12.5px;margin:10px 13px}
  .leaflet-container a.leaflet-popup-close-button{color:var(--tx2)}
  .founder-div{background:none;border:0}
  .founder-beacon{position:relative;width:34px;height:34px;filter:drop-shadow(0 0 6px rgba(250,172,34,.8))}
  .founder-beacon::before{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(250,172,34,.6);animation:fbpulse 1.8s ease-out infinite}
  @keyframes fbpulse{0%{box-shadow:0 0 0 0 rgba(250,172,34,.55)}70%{box-shadow:0 0 0 16px rgba(250,172,34,0)}100%{box-shadow:0 0 0 0 rgba(250,172,34,0)}}
  .pres-div{background:none;border:0}
  .pres-grp{width:24px;height:24px;border-radius:50%;background:#2bc47e;border:2px solid #0c1b39;box-shadow:0 0 0 2px rgba(43,196,126,.45),0 2px 6px rgba(0,0,0,.5);color:#06231a;font:700 11px var(--num);display:flex;align-items:center;justify-content:center}
  .pres-grp.stale{background:#7c869c;color:#0c1b39;box-shadow:none;opacity:.7}
  .maptools{display:flex;gap:6px}
  .mini{background:var(--navy-2);border:1px solid var(--blue-2);color:var(--tx2);border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;font-weight:700}
  .mini.on{background:var(--gold);color:#1a1204;border-color:var(--gold)}
  #spread-btn.on{background:#2bc47e;color:#06231a;border-color:#2bc47e}
  #tgl-bound.on{background:transparent;color:#fff;border:1.5px dashed rgba(255,255,255,.75)}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:7px 13px;font-size:11px;color:var(--tx2);border-top:1px solid var(--line);flex:0 0 auto}

  items.forEach(function(x){x.style.display='';}); var more=el.querySelector('.fit-more'); if(more)more.remove(); more=null;
  var hidden=0;
  while(el.scrollHeight>el.clientHeight+1 && hidden<items.length){
    items[items.length-1-hidden].style.display='none'; hidden++;
    if(!more && moreFn){ more=document.createElement('div'); more.className='fit-more feed-more'; more.onclick=moreFn; el.appendChild(more); }
    if(more) more.textContent=moreTxt.replace('{n}',hidden);
  }
  /* second pass: re-show hidden items while they still fit (the "more" row can free space) */
  for(var j=items.length-hidden;j<items.length;j++){ var it=items[j]; it.style.display=''; if(el.scrollHeight>el.clientHeight+1){ it.style.display='none'; break; } hidden--; }
  if(more){ if(hidden<=0) more.remove(); else more.textContent=moreTxt.replace('{n}',hidden); }
  /* never leave a section heading orphaned at the bottom */
  var vis=items.filter(function(x){return x.style.display!=='none';});
  while(vis.length && (vis[vis.length-1].classList.contains('rh')||vis[vis.length-1].classList.contains('fsec'))){ vis.pop().style.display='none'; hidden++; }
  if(hidden>0 && moreFn && !el.querySelector('.fit-more')){ more=document.createElement('div'); more.className='fit-more feed-more'; more.onclick=moreFn; el.appendChild(more); }
  if(more && hidden>0) more.textContent=moreTxt.replace('{n}',el.querySelectorAll('.item.fi[style*="none"],.ri.fi[style*="none"]').length||hidden);
}

 var j=null; try{ var r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&polygon_geojson=1&addressdetails=1&limit=1&accept-language=he,en&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}}); j=r.ok?await r.json():null; }catch(e){ j=null; }
 var hit=j&&j[0];
 if(!hit){ try{ alert('לא נמצא מקום בשם "'+q+'". נסו שם עיר באנגלית, למשל "Miami, FL".'); }catch(e){} fillTerrSel(); return false; }
 var ad=hit.address||{}, cc=String(ad.country_code||'').toLowerCase();
 var nm=ad.city||ad.town||ad.village||ad.municipality||ad.county||hit.name||q;
 if(cc==='il'){ var i=DATA._sorted.findIndex(function(x){return x.city===nm||x.city===String(nm).replace(/-/g,' ');}); if(i>=0){ if(CLIENT)CLIENT.territory=DATA._sorted[i].city; render(i); return true; } }
 var c={city:String(nm), lat:+hit.lat, lng:+hit.lon, total:null, cats:{}, noData:true, intl:cc!=='il', country:ad.country||'', cc:cc};
 _boundaryCache[c.city]=(hit.geojson&&(hit.geojson.type==='Polygon'||hit.geojson.type==='MultiPolygon'))?hit.geojson:null;
 DATA._custom=c; if(CLIENT) CLIENT.territory=c.city; render(-1); return true;
}
function _applyTerrParam(){ try{ var q=new URLSearchParams(location.search).get('terr'); if(q){ var i=DATA._sorted.findIndex(function(x){return x.city===q;}); if(i>=0)render(i); else setIntlTerritory(q); } }catch(e){} }
function render(idx){
 var cities=DATA._sorted,c=cityAt(idx);if(!c)return;
 if(_curCity!==c){ _sosFocusLock=false; _presFitFor=null; }
 _curCity=c;DATA._idx=idx;_focus=null;
 try{var _ab2=document.getElementById('acct-btn');if(_ab2&&!_ab2._b){_ab2._b=1;_ab2.onclick=openAccount;}}catch(e){}
 var db=document.getElementById('donutback');if(db)db.style.display='none';
 var rbk=document.getElementById('recsback');if(rbk)rbk.style.display='none';
 fillTerrSel();
 var tn=document.getElementById('terr-name'); if(tn) tn.textContent=c.city;
 buildKPIs(idx);
 if(cityLayer){MAP.removeLayer(cityLayer);}cityLayer=L.layerGroup().addTo(MAP);if(!_boundVisible){MAP.removeLayer(cityLayer);}
 if(spreadLayer){MAP.removeLayer(spreadLayer);spreadLayer=null;var sp=document.getElementById('spread-btn');if(sp)sp.classList.remove('on');}
 drawTerritory(c);
 if(hasStats(c)){
  var cats=Object.keys(c.cats),maxCat=Math.max.apply(null,cats.map(function(k){return c.cats[k];}));
  /* city-level totals per category — drawn around the centre as symbols, NOT incident locations */
  cats.forEach(function(k){var ang=(cats.indexOf(k)/cats.length)*Math.PI*2,dist=0.012+(c.cats[k]/maxCat)*0.022;var la=c.lat+Math.cos(ang)*dist,ln=c.lng+Math.sin(ang)*dist/Math.cos(c.lat*Math.PI/180);
   var mk=L.circleMarker([la,ln],{radius:6+Math.sqrt(c.cats[k])/6,color:'#ffffff',weight:1.6,opacity:.9,fillColor:catCol(k),fillOpacity:.95});
   var ns=natShare(cities,k),cs=c.cats[k]/c.total,flag=cs>ns*1.12?' ⚠️ מעל הממוצע':(cs<ns*0.88?' ✓ מתחת לממוצע':'');
   mk.on('mouseover',function(){insp('<b style="color:'+catCol(k)+'">'+catShort(k)+'</b><br>'+fmt(c.cats[k])+' · '+Math.round(cs*100)+'%'+flag+'<br><span style="color:var(--tx3);font-size:11px">סה״כ עירוני 2025 · מיקום סמלי</span>');});
   mk.on('mouseout',function(){insp(null);});
   mk.on('click',function(){focusCat(k);});
   mk.bindPopup('<b>'+catShort(k)+'</b><br>'+fmt(c.cats[k])+' · '+Math.round(cs*100)+'%<br><span style="color:#8aa;font-size:11px">סה״כ עירוני 2025 · מיקום סמלי, לא מיקום אירוע</span><br><span style="color:'+catCol(k)+'">▸ לחצו לצלילה</span>');
   mk.addTo(cityLayer);});
 }
 document.getElementById('donutpane').innerHTML=donutHero(idx);
 buildAnalysis(idx);buildRank(idx);
 try{ window._trNoAnim=false; renderTrendInline('analysispane'); }catch(e){}
 var fs=document.getElementById('feed-src');if(fs)fs.textContent=(CLIENT&&CLIENT.demo)?'נתוני הדגמה':'רשת שומרים · חי';
 loadLive(c);
}
(function(){var ts=document.getElementById('terr-sel');if(ts)ts.onchange=onTerrChange;})();
boot();
</script>
