<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SH✡MER Command · Municipal Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#e0a828;--brass:#c2a661;
    --bg0:#161a22;--bg1:#0f1218;           /* warm graphite, not navy */
    --dark:#1b2030;--dark2:#222a3d;--db:#2d3650;  /* monitoring panes */
    --ivory:#f4f1ea;--ivory2:#eae5da;--ink:#191c22; /* light action panes */
    --tx:#eef1f7;--tx2:#9aa6bd;--tx3:#6d7893;
    --ok:#2bb673;--warn:#f2b705;--bad:#e5484d;
    --blue:#3b82f6;--violet:#9b6cff;--teal:#15b79e;--pink:#e5468e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 600px at 80% -5%,#1c2333,var(--bg1) 60%);color:var(--tx);font-family:'Rubik',system-ui,-apple-system,Arial,sans-serif;overflow:hidden}
  .hidden{display:none!important}
  /* ---------- GATE ---------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% -10%,#20283c,var(--bg1) 60%)}
  .gate .box{width:100%;max-width:400px;background:var(--dark);border:1px solid var(--db);border-radius:18px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .gate h1{text-align:center;font-size:23px;font-weight:800;margin-bottom:4px}
  .gate h1 .s{color:var(--gold)}
  .gate .tag{text-align:center;font-size:11px;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
  label{display:block;font-size:12px;color:var(--tx2);margin:12px 0 5px}
  input,select{width:100%;height:48px;background:var(--bg1);border:1px solid var(--db);border-radius:11px;color:var(--tx);padding:0 14px;font-size:15px;outline:none;font-family:inherit}
  input:focus,select:focus{border-color:var(--gold)}
  .btn{width:100%;height:50px;border:0;border-radius:11px;background:linear-gradient(135deg,#b8841c,#e0a828 60%,#f3cf6a);color:#231806;font-weight:800;font-size:16px;cursor:pointer;margin-top:18px;font-family:inherit}
  .btn:active{transform:scale(.99)}
  .lnk{display:block;text-align:center;margin-top:14px;color:var(--tx2);font-size:13px;cursor:pointer;background:none;border:0;width:100%;font-family:inherit}
  .lnk b{color:var(--gold)}
  .err{color:#ff6b7d;font-size:13px;margin-top:12px;min-height:16px;text-align:center}
  /* ---------- APP SHELL (no-scroll console) ---------- */
  #app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;flex:0 0 52px;background:linear-gradient(180deg,#1b2233,#141a27);border-bottom:1px solid var(--db)}
  .brand{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:17px;letter-spacing:.3px;white-space:nowrap}
  .brand .s{color:var(--gold)}
  .brand small{font-weight:500;font-size:10px;color:var(--tx3);letter-spacing:.12em;text-transform:uppercase}
  .tb-sp{flex:1}
  .terr-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
  .terr-pick select{height:34px;width:auto;min-width:150px;background:var(--dark2);border-color:var(--db);font-size:13px;font-weight:600;color:var(--tx);border-radius:9px;padding:0 10px}
  .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);white-space:nowrap}
  .live .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .tbtn{background:var(--dark2);border:1px solid var(--db);color:var(--tx2);border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .tbtn:hover{border-color:var(--gold);color:var(--tx)}
  /* ---------- KPI STRIP (de-boxed) ---------- */
  .kpis{flex:0 0 auto;display:flex;align-items:stretch;gap:0;padding:0 18px;height:70px;background:rgba(255,255,255,.015);border-bottom:1px solid var(--db)}
  .kpi{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px;border-inline-start:1px solid rgba(255,255,255,.06)}
  .kpi:first-child{border-inline-start:0}
  .kpi .kl{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;display:flex;align-items:center;gap:5px}
  .kpi .kv{font-size:25px;font-weight:800;line-height:1}
  .kpi .km{font-size:11px;color:var(--tx2);margin-top:3px}
  .kpi .kv.gold{color:var(--gold)}.kpi .kv.bad{color:var(--bad)}.kpi .kv.ok{color:var(--ok)}
  .kchip{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-inline-start:6px}
  .kchip.up{background:rgba(229,72,77,.16);color:#ff8a98}.kchip.dn{background:rgba(43,182,115,.16);color:#6ee7a8}
  /* ---------- CONSOLE GRID ---------- */
  .console{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr 340px;gap:14px;padding:14px 18px}
  .col{display:flex;flex-direction:column;gap:14px;min-height:0}
  .pane{border-radius:16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .pane.dark{background:var(--dark);border:1px solid var(--db)}
  .pane.light{background:var(--ivory);color:var(--ink)}
  .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 15px;flex:0 0 auto}
  .ph .t{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .pane.dark .ph{border-bottom:1px solid rgba(255,255,255,.07)}
  .pane.light .ph{border-bottom:1px solid var(--ivory2)}
  .pane.light .ph .t{color:#6a5a2a}
  .pb{flex:1;min-height:0;overflow:auto;padding:13px 15px}
  .pb.nopad{padding:0}
  /* scrollbars */
  .pb::-webkit-scrollbar{width:7px}.pb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  .pane.light .pb::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14)}
  /* provenance pill */
  .pill{font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
  .pill.off{background:rgba(59,130,246,.18);color:#8ab4ff;border:1px solid rgba(59,130,246,.4)}
  .pill.live{background:rgba(229,72,77,.18);color:#ff8a98;border:1px solid rgba(229,72,77,.4)}
  .pane.light .pill.off{background:rgba(59,130,246,.12);color:#2563cc;border-color:rgba(59,130,246,.3)}
  /* ---------- DONUT HERO ---------- */
  .donut-hero{display:flex;flex-direction:column;align-items:center;gap:4px}
  .donut-hero .hint{font-size:11px;color:#8a7a45;background:rgba(224,168,40,.12);padding:3px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;font-weight:600}
  .donut-wrap{position:relative;cursor:pointer}
  .dleg{width:100%;margin-top:8px}
  .dleg .r{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:background .12s}
  .dleg .r:hover{background:rgba(0,0,0,.05)}
  .dleg .r .ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
  .dleg .r .ico svg{width:15px;height:15px}
  .dleg .r .n{flex:1;font-size:13px;color:var(--ink);font-weight:500}
  .dleg .r .v{font-weight:800;font-size:14px}
  .dleg .r .chev{color:#b9b0a0;font-size:12px}
  /* deep dive */
  .dd-back{background:var(--ivory2);border:0;color:#6a5a2a;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600}
  .ddr{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--ivory2)}
  .ddr span{color:#5c636e}.ddr b{font-weight:700}
  .ddh{font-size:10.5px;color:#8a8577;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 7px;font-weight:700}
  .cmp{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px}
  .cmp .nm{width:78px;color:#5c636e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmp .tr{flex:1;height:11px;background:var(--ivory2);border-radius:6px;overflow:hidden}
  .cmp .fl{height:100%;border-radius:6px}
  .cmp.me .nm{color:var(--ink);font-weight:800}
  .cmp .vv{width:52px;text-align:end;font-weight:700;color:var(--ink)}
  /* ---------- MAP ---------- */
  #map{flex:1;min-height:0;width:100%}
  .maptools{display:flex;gap:7px}
  .mini{background:var(--dark2);border:1px solid var(--db);color:var(--tx2);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit}
  .mini.on{background:var(--gold);color:#231806;border-color:var(--gold);font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:9px;padding:9px 15px;font-size:10.5px;color:var(--tx2);border-top:1px solid rgba(255,255,255,.06);flex:0 0 auto}
  .legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:3px}
  .insp{position:absolute;bottom:10px;inset-inline-start:10px;z-index:500;background:rgba(20,26,39,.94);border:1px solid var(--db);border-radius:10px;padding:8px 12px;font-size:12px;max-width:62%;pointer-events:none;display:none}
  .insp.on{display:block}
  .leaflet-pulse{border-radius:50%;animation:lpulse 1.6s infinite}
  @keyframes lpulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}70%{box-shadow:0 0 0 13px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  /* ---------- INSIGHTS + SOLUTIONS (light action pane) ---------- */
  .ins{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--ivory2)}
  .ins:last-child{border-bottom:0}
  .ins .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:14px;font-weight:800}
  .ins .ic.up{background:rgba(229,72,77,.14);color:#c23a3f}
  .ins .ic.info{background:rgba(59,130,246,.13);color:#2563cc}
  .ins .ic.flag{background:rgba(224,168,40,.16);color:#9a7318}
  .ins .tt{font-size:13px;font-weight:700;color:var(--ink)}
  .ins .dd{font-size:12px;color:#4d5563;line-height:1.5;margin-top:2px}
  .ins .dd b{color:var(--ink)}
  .ins .src{font-size:10.5px;margin-top:4px}
  .ins .src a{color:#2563cc;text-decoration:none}.ins .src a:hover{text-decoration:underline}
  .juris{font-size:11px;color:#6a5a2a;background:rgba(224,168,40,.1);border-radius:8px;padding:6px 10px;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:600}
  .foot{font-size:10px;color:#8a8577;margin-top:9px;border-top:1px solid var(--ivory2);padding-top:7px;line-height:1.5}
  /* ---------- FEED ---------- */
  .feed .item{display:flex;gap:10px;padding:9px 15px;border-bottom:1px solid rgba(255,255,255,.055);align-items:center}
  .feed .sev{width:4px;align-self:stretch;border-radius:3px;flex:0 0 auto}
  .feed .dot{width:32px;height:32px;border-radius:9px;background:var(--dark2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .feed .nm{font-size:13px;font-weight:600}.feed .mt{font-size:10.5px;color:var(--tx3)}
  .empty{color:var(--tx3);font-size:12px;padding:20px 16px;text-align:center;line-height:1.6}
  /* ---------- RANKING ---------- */
  .rank .row{display:flex;align-items:center;gap:10px;padding:8px 15px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px}
  .rank .row.me{background:rgba(224,168,40,.12)}
  .rank .row.me .city{color:var(--gold);font-weight:800}
  .rank .pos{width:22px;color:var(--tx3);font-weight:700;text-align:center}
  .rank .city{flex:1;color:var(--tx)}
  .rank .bar{width:70px;height:7px;background:var(--dark2);border-radius:4px;overflow:hidden}
  .rank .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:4px}
  .rank .tot{width:56px;text-align:end;color:var(--tx2);font-weight:600;font-size:11.5px}
  .rank-note{font-size:11px;color:var(--tx3);padding:9px 15px;line-height:1.5;border-bottom:1px solid rgba(255,255,255,.06)}
  /* ---------- RESPONSIVE: allow scroll on small ---------- */
  @media(max-width:1100px){
    body{overflow:auto}#app{height:auto;min-height:100vh;overflow:visible}
    .console{grid-template-columns:1fr;padding:14px}
    .col{min-height:0}.pane{min-height:220px}#map{min-height:300px}
  }
  @media print{body{background:#fff;color:#111;overflow:visible}#app{height:auto}.console{grid-template-columns:1fr}.pane{break-inside:avoid}}
</style>
</head>
<body>

<!-- AUTH GATE -->
<div id="gate" class="gate">
  <div class="box">
    <h1>SH<span class="s">✡</span>MER <span style="color:var(--tx3);font-weight:400">Command</span></h1>
    <div class="tag" id="gate-tag">Municipal Intelligence · גישת לקוחות</div>
    <div id="view-login">
      <label>אימייל ארגוני</label><input id="email" type="email" dir="ltr" placeholder="you@municipality.gov.il">
      <label>סיסמה</label><input id="pass" type="password" dir="ltr" placeholder="••••••••">
      <button class="btn" id="login-btn">כניסה</button>
      <button class="btn" id="demo-btn" style="background:transparent;border:1px solid var(--gold);color:var(--gold);margin-top:10px">👁  כניסה לדמו · See a live demo</button>
      <button class="lnk" id="to-signup">אין לך גישה עדיין? <b>בקשת גישת לקוח</b></button>
    </div>
    <div id="view-signup" class="hidden">
      <label>שם הארגון / רשות</label><input id="su-org" type="text" placeholder="עיריית ...">
      <label>אימייל</label><input id="su-email" type="email" dir="ltr" placeholder="you@municipality.gov.il">
      <label>סיסמה (8+ תווים)</label><input id="su-pass" type="password" dir="ltr">
      <label>טריטוריה</label><select id="su-terr"></select>
      <button class="btn" id="signup-btn">צור גישת לקוח</button>
      <button class="lnk" id="to-login">כבר יש לך גישה? <b>כניסה</b></button>
    </div>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand">SH<span class="s">✡</span>MER <small>Command · Municipal Intelligence</small></div>
    <div class="tb-sp"></div>
    <div class="terr-pick"><span id="terr-static" class="hidden">טריטוריה: <b id="terr-name" style="color:var(--gold)"></b></span><select id="terr-sel"></select></div>
    <div class="live"><span class="d"></span><span id="org-name"></span></div>
    <button class="tbtn" id="export-btn">⤓ ייצוא</button>
    <button class="tbtn" id="signout">יציאה</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="console">
    <div class="col">
      <div class="pane light" style="flex:1">
        <div class="ph"><span class="t">פילוח עבירות</span><span style="display:flex;gap:7px;align-items:center"><span class="pill off">ציבורי</span><button class="dd-back" id="donutback" style="display:none" onclick="unfocus()">← הכל</button></span></div>
        <div class="pb" id="donutpane"></div>
      </div>
    </div>
    <div class="col">
      <div class="pane dark" style="flex:1.2">
        <div class="ph"><span class="t">מפת פשיעה · גבול שיפוט <span class="pill off">ציבורי</span></span><span class="maptools"><button class="mini" id="spread-btn">◉ פריסת שומרים</button></span></div>
        <div style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column"><div id="map"></div><div class="insp" id="insp"></div></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="pane light" style="flex:1">
        <div class="ph"><span class="t">ניתוח בזמן אמת + מענים מבוססי-ראיות</span><span class="pill off">מקורות מאומתים</span></div>
        <div class="pb" id="analysispane"></div>
      </div>
    </div>
    <div class="col">
      <div class="pane dark" style="flex:1">
        <div class="ph"><span class="t" style="color:#ff8a98">⚡ אירועים חיים · רשת שומרים</span><span class="pill live" id="feed-src">רשת שומרים</span></div>
        <div class="pb nopad feed" id="feed"><div class="empty">מתחבר לרשת SH✡MER…</div></div>
      </div>
      <div class="pane dark" style="flex:1">
        <div class="ph"><span class="t">דירוג ארצי <span class="pill off">ציבורי</span></span></div>
        <div class="rank-note" id="rank-note"></div>
        <div class="pb nopad rank" id="rankbody"></div>
      </div>
    </div>
  </div>
</div>

<script>
var SB_URL='https://otkvebgrdiayjnqrytrn.supabase.co', SB_KEY='sb_publishable_ZSMgkwuVwKwqrMgEIlG4Nw_-CmQ_Yct';
var sb=supabase.createClient(SB_URL,SB_KEY);
var CAT_COL={'עבירות כלפי הרכוש':'#2f80ed','עבירות סדר ציבורי':'#f2b705','עבירות נגד גוף':'#e5484d','עבירות כלפי המוסר':'#e5468e','עבירות מרמה':'#18c29c','עבירות כלכליות':'#9b6cff'};
var DATA=null, MAP=null, cityLayer=null, CLIENT=null, _curCity=null;
var ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';
var ESRIr='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}';
function fmt(n){return (n||0).toLocaleString('en-US');}
function topCat(c){var b='',v=-1;for(var k in c){if(c[k]>v){v=c[k];b=k;}}return {name:b,val:v};}
function gerr(m){document.getElementById('gate-err').textContent=m||'';}

/* ---- auth UI ---- */
document.getElementById('to-signup').onclick=function(){document.getElementById('view-login').classList.add('hidden');document.getElementById('view-signup').classList.remove('hidden');gerr('');};
document.getElementById('to-login').onclick=function(){document.getElementById('view-signup').classList.add('hidden');document.getElementById('view-login').classList.remove('hidden');gerr('');};
document.getElementById('login-btn').onclick=async function(){
  gerr(''); var e=document.getElementById('email').value.trim(), p=document.getElementById('pass').value;
  if(!e||!p){gerr('הזן אימייל וסיסמה');return;}
  var r=await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){gerr('כניסה נכשלה: '+r.error.message);return;}
  boot();
};
document.getElementById('signup-btn').onclick=async function(){
  gerr(''); var org=document.getElementById('su-org').value.trim(), e=document.getElementById('su-email').value.trim(), p=document.getElementById('su-pass').value, terr=document.getElementById('su-terr').value;
  if(!org||!e||p.length<8||!terr){gerr('מלא/י את כל השדות (סיסמה 8+ תווים)');return;}
  var r=await sb.auth.signUp({email:e,password:p,options:{data:{org:org,territory:terr,role:'client'}}});
  if(r.error){gerr('יצירה נכשלה: '+r.error.message);return;}
  if(r.data && r.data.session){ boot(); }
  else { gerr('✓ נוצרה גישה. בדוק/י את האימייל לאישור, ואז היכנס/י.'); document.getElementById('to-login').click(); }
};
document.getElementById('signout').onclick=async function(){ try{ if(!(CLIENT&&CLIENT.demo)) await sb.auth.signOut(); }catch(e){} location.reload(); };
document.getElementById('demo-btn').onclick=function(){ demoBoot(); };
(function(){var ex=document.getElementById('export-btn'); if(ex) ex.onclick=function(){ window.print(); };})();
(function(){var sp=document.getElementById('spread-btn'); if(sp) sp.onclick=function(){ if(_curCity) toggleSpread(_curCity); };})();
var DEMO_INC=[

  k('עבירות אלימות',violPct+'%',fmt(viol)+' נגד גוף',(violPct>12?'bad':'ok'))+
  k('פשיעה ל-1,000',pc?pc.toFixed(1):'—',ratio?('×'+ratio.toFixed(1)+' מהחציון הארצי*'):'הערכת למ״ס*',(ratio&&ratio>1.2?'bad':ratio&&ratio<0.9?'ok':''))+
  k('רשת שומרים',cov,'משתמשים פעילים');
}

function buildRank(idx){
 var cities=DATA._sorted,max=cities[0].total;
 document.getElementById('rank-note').textContent='דירוג '+cities.length+' הערים הגדולות לפי סה״כ עבירות מדווחות (משטרת ישראל 2025). הטריטוריה שלך מודגשת.';
 document.getElementById('rankbody').innerHTML=cities.map(function(x,i){var w=Math.round(x.total/max*100);return '<div class="row '+(i===idx?'me':'')+'"><span class="pos">'+(i+1)+'</span><span class="city">'+x.city+'</span><span class="bar"><i style="width:'+w+'%"></i></span><span class="tot">'+fmt(x.total)+'</span></div>';}).join('');
}

function buildAnalysis(idx){
 var cities=DATA._sorted,c=cities[idx],tot=c.total;natShare(cities,'x');
 var ranked=Object.keys(c.cats).map(function(k){var cs=c.cats[k]/tot,ns=natShare(cities,k);return{k:k,cs:cs,ns:ns,gap:cs-ns};}).sort(function(a,b){return b.gap-a.gap;});
 var pc=perCap(c);var pv=cities.map(perCap).filter(function(v){return v!=null;}).sort(function(a,b){return a-b;});var med=pv[Math.floor(pv.length/2)];
 var tc=topCat(c.cats);var out=[];
 var top=ranked[0];var d=top.ns?Math.round((top.cs/top.ns-1)*100):0;
 out.push({cls:'up',i:'▲',t:catShort(top.k)+' — '+Math.round(top.cs*100)+'% מהעבירות',
  d:'העבירה הדומיננטית, '+(d>0?'<b>+'+d+'%</b> מעל הממוצע הארצי':'קרוב לממוצע הארצי')+' ('+Math.round(top.ns*100)+'%). סיור מכוון לנקודות החמות הראה <b>−16% פשיעה</b> במטא-אנליזה של 78 ניסויים.',
  src:'OJP CrimeSolutions — Hot Spots (דירוג: Effective)',url:'https://crimesolutions.ojp.gov/ratedpractices/hot-spots-policing'});
 if(pc&&med){var r=pc/med;out.push({cls:'flag',i:'◉',t:'עוצמת פשיעה לנפש',
  d:'<b>'+pc.toFixed(1)+'</b> עבירות ל-1,000 תושבים — <b>×'+r.toFixed(1)+'</b> החציון הארצי ('+med.toFixed(1)+'). '+(r>1.2?'עוצמה גבוהה — מצדיק הקצאת משאבים מוגברת.':r<0.9?'עוצמה נמוכה יחסית — שמירה על מגמה.':'עוצמה בינונית.'),
  src:'מחושב מנתוני משטרה + הערכת למ״ס',url:''});}
 var near=cities.map(function(x){return{x:x,d:Math.hypot(x.lat-c.lat,x.lng-c.lng)};}).sort(function(a,b){return a.d-b.d;}).slice(1,7).map(function(o){return o.x;});
 var worse=near.filter(function(x){return (perCap(x)||0)>(pc||0);}).length;
 out.push({cls:'info',i:'⌖',t:'מיקום יחסי',d:'מדורגת <b>#'+(idx+1)+'</b> ארצית בנפח. מבין 6 הערים הסמוכות, <b>'+worse+'</b> חמורות יותר בפשיעה לנפש.',src:'',url:''});
 var insHTML=out.map(function(o){return '<div class="ins"><div class="ic '+o.cls+'">'+o.i+'</div><div style="flex:1"><div class="tt">'+o.t+'</div><div class="dd">'+o.d+'</div>'+(o.src?'<div class="src">'+(o.url?'<a href="'+o.url+'" target="_blank" rel="noopener">'+o.src+' ↗</a>':o.src)+'</div>':'')+'</div></div>';}).join('');
 var set=SOLSET[tc.name]||SOLSET['עבירות כלפי הרכוש'];
 var solHTML='<div class="juris">⚖️ תחום שיפוט: ישראל · מותאם לעבירה המובילה: '+catShort(tc.name)+'</div>'+
  set.map(function(o){return '<div class="ins"><div class="ic flag">'+o.n+'</div><div style="flex:1"><div class="tt">'+o.t+'</div><div class="dd">'+o.d+'</div><div class="src"><a href="'+o.u+'" target="_blank" rel="noopener">'+o.s+' ↗</a></div></div></div>';}).join('');
 document.getElementById('analysispane').innerHTML=
  '<div class="ddh" style="margin-top:0">תובנות בזמן אמת</div>'+insHTML+
  '<div class="ddh">מענים מבוססי-ראיות</div>'+solHTML+
  '<div class="foot">המספרים מחושבים בזמן אמת מנתוני משטרת ישראל 2025. המענים מבוססים על מחקר מבוקר בלבד (קישור בכל כרטיס). אין זו המלצה משפטית מחייבת — יישום בתיאום הרשות והמשטרה.</div>';
}

function renderLegend(){var el=document.getElementById('legend');if(!el)return;el.innerHTML=Object.keys(CAT_META).map(function(k){return '<span><i style="background:'+catCol(k)+'"></i>'+catShort(k)+'</span>';}).join('');}

function render(idx){
 var cities=DATA._sorted,c=cities[idx];if(!c)return;_curCity=c;DATA._idx=idx;_focus=null;
 var db=document.getElementById('donutback');if(db)db.style.display='none';
 var ts=document.getElementById('terr-sel');
 if(ts&&!ts.options.length){cities.forEach(function(x){var o=document.createElement('option');o.value=x.city;o.textContent=x.city;ts.appendChild(o);});}
 if(ts)ts.value=c.city;
 buildKPIs(idx);
 if(cityLayer){MAP.removeLayer(cityLayer);}cityLayer=L.layerGroup().addTo(MAP);
 if(spreadLayer){MAP.removeLayer(spreadLayer);spreadLayer=null;var sp=document.getElementById('spread-btn');if(sp)sp.classList.remove('on');}
 var cats=Object.keys(c.cats),maxCat=Math.max.apply(null,cats.map(function(k){return c.cats[k];}));
 drawTerritory(c);
 cats.forEach(function(k){var ang=(cats.indexOf(k)/cats.length)*Math.PI*2,dist=0.012+(c.cats[k]/maxCat)*0.022;var la=c.lat+Math.cos(ang)*dist,ln=c.lng+Math.sin(ang)*dist/Math.cos(c.lat*Math.PI/180);
  var mk=L.circleMarker([la,ln],{radius:6+Math.sqrt(c.cats[k])/6,color:'#141a27',weight:1.5,fillColor:catCol(k),fillOpacity:.92});
  var ns=natShare(cities,k),cs=c.cats[k]/c.total,flag=cs>ns*1.12?' ⚠️ מעל הממוצע':(cs<ns*0.88?' ✓ מתחת לממוצע':'');
  mk.on('mouseover',function(){insp('<b style="color:'+catCol(k)+'">'+catShort(k)+'</b><br>'+fmt(c.cats[k])+' · '+Math.round(cs*100)+'%'+flag);});
  mk.on('mouseout',function(){insp(null);});
  mk.on('click',function(){focusCat(k);});
  mk.bindPopup('<b>'+catShort(k)+'</b><br>'+fmt(c.cats[k])+' · '+Math.round(cs*100)+'%<br><span style="color:'+catCol(k)+'">▸ לחצו לצלילה</span>');
  mk.addTo(cityLayer);});
 document.getElementById('donutpane').innerHTML=donutHero(idx);
 buildAnalysis(idx);buildRank(idx);
 var fs=document.getElementById('feed-src');if(fs)fs.textContent=(CLIENT&&CLIENT.demo)?'נתוני הדגמה':'רשת שומרים · חי';
 loadLive(c);
}
(function(){var ts=document.getElementById('terr-sel');if(ts)ts.onchange=function(){var i=DATA._sorted.findIndex(function(x){return x.city===ts.value;});if(i>=0)render(i);};})();

boot();
</script>
