<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SH✡MER Nature — שומרים על מי שאין לו קול</title>
<meta name="description" content="SH✡MER Nature — בקרוב. שומרים על מי שאין לו קול.">
<meta name="robots" content="noindex">
<link rel="icon" href="badge-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* NAVY IS THE BASE. Light bands break it, they do not replace it. */
  --n0:#08120C; --n1:#0F1712; --n2:#16241A; --n3:#1E3324; --n5:#2A4A33;
  --tx0:#F1F7F0; --tx1:#C2D6C2; --tx2:#7E947F;
  --au1:#3A9E18; --au2:#50DB0F; --au3:#8EF25A;
  --au-grad:linear-gradient(135deg,#2F8A10,#50DB0F,#8EF25A);
  /* light break bands */
  --stone:#E9F0E6; --stone2:#DCE6D8; --ink-on-light:#12200F; --ink2-on-light:#46543F;
  --sos:#D93B3B;
  --s1:8px;--s2:16px;--s3:24px;--s4:40px;--s5:64px;--s6:96px;--s7:128px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{background:var(--n0);color:var(--tx0);font-family:'Heebo',sans-serif;font-weight:400;
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
.w{width:min(1100px,90vw);margin-inline:auto}
.wn{width:min(820px,90vw);margin-inline:auto}
a:focus-visible,button:focus-visible{outline:2px solid var(--au2);outline-offset:3px}

.eyebrow{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--au3)}
.h1{font-size:clamp(38px,7.4vw,72px);font-weight:900;line-height:1.06;letter-spacing:-.035em}
.h2{font-size:clamp(27px,4.4vw,44px);font-weight:800;line-height:1.15;letter-spacing:-.028em}
.h3{font-size:20px;font-weight:700;letter-spacing:-.015em}
.lead{font-size:clamp(18px,2.2vw,21px);color:var(--tx1);line-height:1.6;font-weight:300}
.body{color:var(--tx1);line-height:1.7}

nav{position:fixed;inset-inline:0;top:0;z-index:60;background:rgba(8,18,12,.92);
  backdrop-filter:blur(14px);border-bottom:1px solid rgba(80,219,15,.18)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;letter-spacing:.03em}
.brand img{width:32px;height:32px} .brand i{font-style:normal;color:var(--au3)}
.nav-r{display:flex;align-items:center;gap:var(--s1)}
.lang button{width:44px;height:44px;border:0;background:none;color:var(--tx2);
  font:500 12px/1 'Heebo',sans-serif;cursor:pointer}
.lang button.on{color:var(--au3);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;
  padding:0 var(--s4);background:var(--au-grad);color:var(--n0);border-radius:999px;
  font-weight:700;font-size:16px;transition:transform .18s ease,box-shadow .18s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px rgba(80,219,15,.55)}
.btn svg{width:17px;height:17px;stroke-width:2.3}
.btn-sm{min-height:44px;padding:0 var(--s3);font-size:14px}

/* HERO — photo, slogan, one action. Trust before features. */
.hero{position:relative;min-height:92svh;display:flex;align-items:flex-end;
  padding:var(--s6) 0 var(--s5);overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:50% 30%;opacity:0;transition:opacity 1.8s ease}
.hero-bg img.on{opacity:1}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,18,12,.62),rgba(8,18,12,.42) 38%,rgba(8,18,12,.97))}
.hero-in{position:relative;z-index:2}
/* the badge is the brand mark — displayed large on navy, never small */
.hero-badge{width:clamp(112px,20vw,168px);height:auto;margin-bottom:var(--s3);
  filter:drop-shadow(0 6px 28px rgba(0,0,0,.65))}
.close-badge{width:clamp(104px,18vw,148px);margin:0 auto var(--s3);
  filter:drop-shadow(0 6px 28px rgba(0,0,0,.5))}

.hero .eyebrow{color:var(--au3)}
.hero .h1{margin:var(--s2) 0 var(--s3);max-width:13ch}
.hero .lead{color:var(--tx1);max-width:36ch}
.hero-cta{margin-top:var(--s4);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3)}

.hero-alt{color:var(--tx2);font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.hero-alt a{color:var(--au3);border-bottom:1px solid rgba(80,219,15,.5);display:inline-flex;align-items:center;min-height:44px;padding:0 2px}

/* TRUST BAND — takes the place of testimonials we do not yet have */
.trust{background:var(--n1);border-block:1px solid rgba(80,219,15,.16);padding:var(--s5) 0}
.trust-q{font-size:clamp(20px,3vw,29px);font-weight:300;line-height:1.45;
  color:var(--tx0);max-width:22ch;margin-inline:auto;text-align:center}
.trust-q b{font-weight:800}
.trust-src{margin-top:var(--s3);text-align:center;font-size:13px;font-weight:700;
  letter-spacing:.14em;color:var(--au1)}

/* HOW — numbered, with real screens */
.sec{padding:var(--s7) 0}
.sec-light{background:linear-gradient(180deg,var(--stone),var(--stone2));color:var(--ink2-on-light)}
.sec-light .eyebrow{color:#2F8A10}
.sec-light .h2{color:var(--ink-on-light)}
.sec-light .step h3{color:var(--ink-on-light)}
.sec-light .step p{color:var(--ink2-on-light)}
.sec-light .step .n{background:var(--ink-on-light)}
.sec-head{text-align:center;max-width:24ch;margin:0 auto var(--s5)}
.sec-head .eyebrow{display:block;margin-bottom:var(--s2)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4)}
.step{text-align:center}
.step .shot{border-radius:26px;overflow:hidden;background:#000;aspect-ratio:1080/2146;
  margin:0 auto var(--s3);width:min(210px,100%);border:7px solid var(--n2);
  box-shadow:0 24px 50px -28px rgba(19,24,32,.55)}
.step .shot img{width:100%;height:100%;object-fit:cover}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;
  font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;
  margin:0 auto var(--s2)}
.step h3{margin-bottom:6px}
.step p{font-size:15.5px;color:var(--ink2);line-height:1.6;max-width:30ch;margin-inline:auto}
@media(max-width:760px){
  .steps{grid-template-columns:1fr;gap:var(--s4)}
  .step .shot{width:min(150px,52%)}
  .sec-light{padding:var(--s5) 0}
  .sec-light .sec-head{margin-bottom:var(--s4)}
}

/* VALUES — the covenant. This is what Noonlight cannot say. */

.vals .eyebrow{color:var(--au3)}
.vals .h2{color:var(--tx0)}
.vals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);margin-top:var(--s5)}
.val h3{color:var(--tx0);margin-bottom:6px}
.val p{color:var(--tx1);font-size:15.5px;line-height:1.65}
.val .bar{width:32px;height:2px;background:var(--au-grad);margin-bottom:var(--s2)}
@media(max-width:760px){.vals-grid{grid-template-columns:1fr;gap:var(--s4)}}

/* FEATURES — small, last, like Noonlight */
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2) var(--s5);
  max-width:760px;margin:var(--s5) auto 0}
.feat{padding:var(--s3) 0;border-top:1px solid rgba(80,219,15,.16)}
.feat h3{font-size:17px;margin-bottom:2px}
.feat p{font-size:15px;color:var(--tx1)}
@media(max-width:620px){.feats{grid-template-columns:1fr}}

/* STATS */
.stats{background:var(--n1);border-block:1px solid rgba(80,219,15,.16);padding:var(--s5) 0}
.stats-in{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:var(--s2)}
.stat b{display:block;font-size:clamp(28px,5vw,42px);font-weight:900;letter-spacing:-.03em;
  background:var(--au-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat span{font-size:14px;color:var(--tx1)}

/* CLOSE */
.close{padding:var(--s7) 0;text-align:center}
.close .h2{max-width:17ch;margin:0 auto var(--s3)}
.close .lead{max-width:38ch;margin:0 auto var(--s4)}
.note{margin-top:var(--s5);font-size:14px;color:var(--tx2);max-width:50ch;
  margin-inline:auto;line-height:1.6}
.note b{color:var(--sos);font-weight:700}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
footer{border-top:1px solid rgba(80,219,15,.16);padding:var(--s4) 0;text-align:center}
footer p{font-size:13px;color:var(--tx2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<nav><div class="w nav-in">
  <span class="brand"><img src="nature-badge.png" alt="">SH<i>✡</i>MER <span style="color:#2F8A10">Nature</span></span>
  <span class="nav-r">
    <span class="lang">
      <button class="on" id="L-he" onclick="setLang('he')">עב</button>
      <button id="L-en" onclick="setLang('en')">EN</button>
      <button id="L-ar" onclick="setLang('ar')">عر</button>
    </span>
    <a href="index.html" class="btn btn-sm" data-t="nav">SH✡MER העירוני</a>
  </span>
</div></nav>

<header class="hero">
  <div class="hero-bg"><img class="on" id="s1" src="nature-hero.jpg" alt=""></div>
  <div class="w hero-in">
    <img class="hero-badge" src="nature-badge.png" alt="SH✡MER Nature">
    <span class="eyebrow" data-t="eb">בקרוב · COMING SOON</span>
    <h1 class="h1" data-t="h1">שומרים על מי שאין לו קול.</h1>
    <p class="lead" data-t="sub">SH✡MER Nature בבנייה. עוד לא זמין להורדה.</p>
    <div class="hero-cta">
      <a href="index.html" class="btn"><span data-t="cta">ל-SH✡MER</span></a>
    </div>
  </div>
</header>

<footer><div class="w"><p>SH✡MER Nature · © 2026 3Shamrocks Studio</p></div></footer>

<script>
var T={
 he:{nav:"SH✡MER העירוני",eb:"בקרוב · COMING SOON",h1:"שומרים על מי שאין לו קול.",
  sub:"SH✡MER Nature בבנייה. עוד לא זמין להורדה.",cta:"ל-SH✡MER"},
 en:{nav:"Urban SH✡MER",eb:"COMING SOON",h1:"Guarding what has no voice.",
  sub:"SH✡MER Nature is under construction. Not available to download yet.",cta:"Go to SH✡MER"},
 ar:{nav:"شومير الحضري",eb:"قريبًا · COMING SOON",h1:"نحرس من لا صوت له.",
  sub:"شومير الطبيعة قيد الإنشاء. غير متاح للتنزيل بعد.",cta:"إلى شومير"}
};
function setLang(l){
  document.documentElement.lang=l;
  document.documentElement.dir=(l==='en')?'ltr':'rtl';
  document.querySelectorAll('[data-t]').forEach(function(el){
    var k=el.getAttribute('data-t'); if(T[l]&&T[l][k]!=null) el.innerHTML=T[l][k];
  });
  ['he','en','ar'].forEach(function(x){var b=document.getElementById('L-'+x); if(b)b.classList.toggle('on',x===l);});
  try{localStorage.setItem('shomerLang',l);}catch(e){}
}
try{var sl=localStorage.getItem('shomerLang'); if(sl&&sl!=='he')setLang(sl);}catch(e){}
</script>
</body>
</html>
